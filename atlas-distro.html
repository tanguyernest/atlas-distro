<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas distro</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mute:#6b6a64;--line:#e2e0d8;--acc:#2f6f4f;--accbg:#e4f0e9;--warn:#9a5b00;--warnbg:#fbf0dc;--code:#efede6}
@media(prefers-color-scheme:dark){:root{--bg:#161715;--card:#1f2120;--ink:#ecebe6;--mute:#9a998f;--line:#33352f;--acc:#6fcf9b;--accbg:#22362b;--warn:#f0b35a;--warnbg:#3a2e17;--code:#2a2c28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 14px 4px;position:relative}
#langBtn{position:absolute;top:6px;right:8px;margin:0;font-size:12px;padding:8px 10px;min-height:32px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px}
.bar{padding:8px 14px;display:grid;gap:8px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.results{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip small{color:var(--mute)}
.desc{padding:2px 14px 8px;color:var(--mute);font-size:13px}
.wrap{overflow-x:auto;margin:0 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th,td{padding:9px 10px;vertical-align:top;border-bottom:1px solid var(--line);text-align:left;font-size:14px;overflow-wrap:anywhere}
tbody th{position:sticky;left:0;background:var(--card);width:104px;min-width:104px;font-size:12px;color:var(--mute);font-weight:600;z-index:1;border-right:1px solid var(--line)}
td{min-width:170px}
tr.sec th,tr.sec td{background:var(--bg);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 10px}
tr.sec th{position:sticky;left:0}
ul{margin:0;padding-left:16px}
li{margin:0 0 3px}
.ok{color:var(--acc);font-weight:600}.no{color:var(--mute)}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--warnbg);color:var(--warn)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accbg);color:var(--acc)}
.conf{color:var(--warn)}
details{margin:0 0 6px}
summary{cursor:pointer;color:var(--acc);font-size:13px}
pre{margin:4px 0 0;padding:8px;background:var(--code);border-radius:6px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
a{color:var(--acc)}
.hd select{font-weight:600;padding:8px 6px}
.hd button{margin-top:6px;border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;padding:2px 0}
.add{margin:0 14px 14px;padding:9px 14px;border:1px dashed var(--line);background:none;color:var(--acc);border-radius:8px;font:inherit;cursor:pointer}
.empty{padding:24px 14px;color:var(--mute);text-align:center}
footer{padding:0 14px 24px;color:var(--mute);font-size:12px}

.tabs{display:flex;gap:6px;padding:8px 14px 0}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.g{padding:14px}
.g h2{font-size:19px;margin:0 0 4px}
.g .lead{color:var(--mute);margin:0 0 14px;font-size:14px}
.card{display:block;width:100%;text-align:left;padding:14px;margin:0 0 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;cursor:pointer}
.card b{display:block;font-size:16px}
.card span{color:var(--mute);font-size:13px}
.card .bst{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--ink)}
.card[disabled]{opacity:.5;cursor:default}
.prog{height:6px;background:var(--line);border-radius:99px;margin:0 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.q{font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:0 0 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:16px;cursor:pointer}
.opt:active{background:var(--accbg)}
.ghost{display:inline-block;margin:4px 12px 0 0;padding:8px 4px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;text-decoration:underline}
.rc{padding:12px 14px;margin:0 0 10px;border:1px solid var(--line);background:var(--card);border-radius:12px}
.rk{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.rt{font-size:17px;font-weight:700;margin:2px 0 4px}
.rc p{margin:0 0 8px;font-size:14px}
.rc button{padding:7px 12px;border:1px solid var(--acc);background:none;color:var(--acc);border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.nofiche{font-size:12px;color:var(--mute)}
.hidden{display:none}

.tree{margin:0 0 16px 6px;padding-left:14px;border-left:2px solid var(--acc)}
.tn{position:relative;margin:0 0 10px}
.tn::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tn.alt::before{background:var(--line)}
.tq{font-size:13px;color:var(--mute);margin:0 0 4px}
.ch{display:inline-block;padding:7px 12px;border-radius:10px;background:var(--accbg);color:var(--acc);font-weight:600;font-size:14px}
.alt-b{display:inline-block;margin:6px 6px 0 0;padding:6px 10px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.alt-b.on{border-style:solid;color:var(--ink)}
.pan{margin:8px 0 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px}
.pan ul{margin:4px 0 8px}
.pan button{padding:6px 11px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);border-radius:8px;font:inherit;font-size:13px;cursor:pointer;margin-right:6px}
.pan button.o{background:none;color:var(--acc)}
.bk{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-size:13px}
.bk b{font-size:14px}
.bk .lb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.tchip{display:inline-block;margin:6px 6px 0 0;padding:3px 9px;border:1px dashed var(--line);border-radius:999px;background:none;color:var(--mute);font:inherit;font-size:12px;cursor:pointer}
.tchip.on{border-style:solid;color:var(--ink)}

.warn{margin:8px 0 0;padding:9px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:13px}
.warn button{margin:6px 6px 0 0;padding:6px 10px;border:1px solid var(--warn);background:none;color:var(--warn);border-radius:8px;font:inherit;font-size:12px;cursor:pointer}
.warn button.p{background:var(--warn);color:var(--bg)}
.mn{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--warnbg);color:var(--warn);margin-left:6px;font-weight:600}
.undo{margin:6px 0 0;padding:0;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;display:block}
.kept{font-size:12px;color:var(--warn);margin-top:6px}
.dim{opacity:.55}
.tchip.sel{background:var(--accbg);color:var(--acc);border:1px solid var(--acc);font-weight:600}
.sw h3{font-size:15px;margin:18px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.big{display:block;width:100%;padding:13px;margin:14px 0 0;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.qm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;padding:0;border:1px solid var(--mute);border-radius:50%;background:none;color:var(--mute);font:600 11px/1 system-ui;cursor:pointer;vertical-align:middle;flex:none}
.qm:active{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
#sheet{position:fixed;inset:0;z-index:50}
#sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sh-card{position:absolute;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;padding:18px 18px 22px;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.sh-card b{display:block;font-size:17px;margin:0 0 6px}
.sh-card p{margin:0 0 10px;font-size:15px}
.sh-card a{display:inline-block;margin:0 14px 0 0;font-size:14px}
#sh-x{padding:8px 14px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.sh-card a.hidden{display:none}
.selq{display:flex;align-items:center}
.selq select{flex:1;min-width:0}
.hwb{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px}
.hwb button{margin-left:8px;border:0;background:none;color:var(--acc);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
.inp{margin:0 0 10px}
.hn{margin:0 0 14px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-size:13px}
.hn ul{margin:4px 0 0;padding-left:16px}
.vbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 14px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 14px;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--bg);font-weight:600}
.chk{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.chk input{width:auto;margin:0}
.wrap{max-height:78vh;overflow:auto}
thead td.hd,thead th.corner{position:sticky;top:0;background:var(--card);z-index:3}
thead th.corner{left:0;z-index:4;width:100px;min-width:100px}
td{min-width:150px}
tbody th{width:100px;min-width:100px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 10px}
.pick .hd select{width:100%}
.cview{padding:0 14px}
.csec{margin:16px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.cr{margin:0 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.crl{padding:8px 12px;font-size:12px;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line)}
.crv{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.crv:last-child{border-bottom:0}
.crn{font-weight:600;font-size:13px;overflow-wrap:anywhere}
details.grp{margin:14px 0 6px;border-top:1px solid var(--line);padding-top:8px}
details.grp>summary{font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;padding:6px 0;list-style:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸ ";color:var(--mute)}
details.grp[open]>summary::before{content:"▾ "}
.cnt{font-size:12px;font-weight:400;color:var(--mute);margin-left:6px}

/* cibles tactiles >= 32px */
.hwb button{padding:8px 10px;margin-left:4px}
.hd button{padding:9px 6px;margin-top:2px}
.tchip{padding:8px 13px}
.alt-b{padding:9px 13px}
.pan button{padding:9px 14px}
.rc button{padding:10px 14px}
.warn button{padding:9px 13px}
.undo{padding:9px 0}
.qm{width:24px;height:24px;font-size:12px;position:relative}
.qm::after{content:"";position:absolute;inset:-10px}
.seg button{padding:10px 16px}
</style>
</head>
<body>
<header>
  <h1>Atlas distro</h1>
  <button class="ghost" id="langBtn" type="button"></button>
  <div class="sub" data-i="ui.sub"></div>
  <div class="warn" id="disclaimer"></div>
</header>
<div class="tabs"><button class="tab" id="tabG" data-i="ui.tab_guide"></button><button class="tab" id="tabC" data-i="ui.tab_compare"></button></div>
<div id="guide" class="g"></div>
<div id="compare">
<div id="cmpBack" class="hidden" style="padding:8px 14px 0"><button class="ghost" id="cmpBackBtn" data-i="ui.back_path"></button></div>
<div class="bar">
  <input id="q" type="search" data-ip="ui.search_ph">
  <div id="res" class="results"></div>
  <div class="row2">
    <div class="selq"><select id="layer" data-ia="ui.layer"></select><button class="qm" id="layerQ" data-ia="ui.help_layer">?</button></div>
    <div class="selq"><select id="cat" data-ia="ui.cat"></select><button class="qm" id="catQ" data-ia="ui.help_cat">?</button></div>
  </div>
</div>
<div id="desc" class="desc"></div>
<div id="main"></div>
</div>
<div id="sheet" class="hidden"><div id="sh-bg"></div><div class="sh-card"><b id="sh-t"></b><p id="sh-p"></p><a id="sh-a" target="_blank" rel="noopener" data-i="ui.more"></a><button id="sh-x" data-i="ui.close"></button></div></div>
<footer data-i="ui.footer"></footer>

<script>
/* ============ DONNÉES ============ */
const LAYERS=[
 {id:"base",name:"Noyau + base système"},
 {id:"packaging",name:"Paquets + construction"},
 {id:"desktop",name:"Bureau / graphique"},
 {id:"software",name:"Logiciels courants"},
 {id:"security",name:"Sécurité"}
];
const C=(id,layer,name,description,criteria)=>({id,layer,name,description,criteria:criteria.map(([key,label,type,unit])=>({key,label,type,unit}))});
const CATS=[
 C("kernel","base","Noyau","Cœur du système, gère le matériel, la mémoire et les processus.",[["release_model","Modèle de support","enum"],["patchset","Correctifs ajoutés","text"],["realtime","Temps réel","enum"],["hardening","Durcissement intégré","enum"],["build_effort","Effort de compilation","enum"]]),
 C("libc","base","Bibliothèque C","Interface entre les programmes et le noyau. Détermine la compatibilité des logiciels.",[["size_mb","Taille","number","Mo"],["binary_compat","Compatibilité binaires précompilés","enum"],["licence_model","Licence","text"],["static_linking","Liaison statique","enum"],["perf_notes","Performances","text"]]),
 C("init","base","Système d'init","Premier processus lancé par le noyau, gère les services.",[["service_format","Format des services","text"],["parallel_boot","Démarrage parallèle","bool"],["supervision","Supervision des processus","enum"],["footprint_mb","Empreinte mémoire","number","Mo"],["extras","Fonctions intégrées","text"]]),
 C("bootloader","base","Chargeur d'amorçage","Charge le noyau au démarrage de la machine.",[["firmware","BIOS / UEFI","enum"],["secure_boot","Secure Boot","enum"],["config_style","Configuration","text"],["fs_support","Systèmes de fichiers lisibles","text"],["complexity","Complexité","enum"]]),
 C("coreutils","base","Outils de base et shell","Commandes de base (ls, cp, grep…) et interpréteur de commandes.",[["size_mb","Taille","number","Mo"],["completeness","Complétude des options","enum"],["language","Langage","text"],["posix","Conformité POSIX","enum"],["scripting_ease","Confort pour les scripts","enum"]]),
 C("filesystem","base","Système de fichiers","Organisation du stockage sur disque.",[["snapshots","Instantanés","bool"],["checksums","Sommes de contrôle","bool"],["encryption","Chiffrement natif","enum"],["in_kernel","Intégré au noyau Linux","bool"],["maturity_notes","Maturité et risques","text"]]),
 C("package-manager","packaging","Gestionnaire de paquets","Installe, met à jour et supprime les logiciels.",[["package_format","Format des paquets","text"],["speed","Rapidité","enum"],["repo_size","Taille des dépôts","enum"],["rollback","Retour en arrière","enum"],["learning_curve","Courbe d'apprentissage","enum"]]),
 C("iso-builder","packaging","Outil de build ISO","Fabrique l'image installable ou live de la distro.",[["base_distro","Distro de base","text"],["customization","Personnalisation","enum"],["reproducible","Build reproductible","bool"],["build_time","Durée de build","enum"],["doc_quality","Documentation","enum"]]),
 C("system-image","packaging","Modèle d'image système","Façon dont le système est stocké et mis à jour.",[["mutable","Système modifiable","bool"],["atomic_update","Mises à jour atomiques","bool"],["rollback","Retour en arrière","bool"],["ram_usage","Usage de la RAM","enum"],["complexity","Complexité","enum"]]),
 C("update-model","packaging","Dépôts et mises à jour","Rythme et stabilité des versions.",[["model","Modèle","enum"],["support_length","Durée de support","text"],["breakage_risk","Risque de casse","enum"],["security_patch_speed","Rapidité des correctifs","enum"],["mirror_needs","Miroir local","text"]]),
 C("display-server","desktop","Serveur d'affichage","Protocole graphique entre les applications et l'écran.",[["security_model","Isolation des applications","enum"],["app_compat","Compatibilité","enum"],["remote_display","Affichage à distance","enum"],["gpu_support","Support GPU","text"],["maturity","Maturité","enum"]]),
 C("compositor","desktop","Compositeur / fenêtres","Dessine et organise les fenêtres.",[["protocol","Protocole","enum"],["layout","Disposition","enum"],["config_style","Configuration","text"],["footprint_mb","Empreinte mémoire","number","Mo"],["effects","Effets visuels","enum"]]),
 C("desktop-environment","desktop","Environnement de bureau","Bureau complet avec ses outils intégrés.",[["footprint_mb","Empreinte mémoire","number","Mo"],["wayland_support","Support Wayland","enum"],["customization","Personnalisation","enum"],["integrated_apps","Applications intégrées","text"],["touch_support","Tactile et mobile","enum"]]),
 C("desktop-shell","desktop","Barre, lanceur, notifications","Éléments d'interface autour du compositeur.",[["component","Rôle","text"],["scripting","Extensibilité","enum"],["theming","Thèmes","text"],["footprint_mb","Empreinte mémoire","number","Mo"],["wayland_native","Natif Wayland","bool"]]),
 C("terminal","desktop","Terminal","Émulateur de terminal.",[["gpu_rendering","Rendu GPU","bool"],["features","Fonctions","text"],["config_style","Configuration","text"],["footprint_mb","Empreinte mémoire","number","Mo"],["language","Langage","text"]]),
 C("audio","desktop","Serveur audio","Gère le son et le routage entre applications.",[["latency","Latence","enum"],["app_compat","Compatibilité","enum"],["bluetooth","Bluetooth","enum"],["config_complexity","Complexité de config","enum"],["video_handling","Partage d'écran","bool"]]),
 C("network","desktop","Gestion du réseau","Connexion Wi-Fi, filaire, VPN.",[["wifi","Wi-Fi","enum"],["vpn_support","Support VPN","enum"],["footprint_mb","Empreinte mémoire","number","Mo"],["interface","Interface","text"],["server_use","Adapté aux serveurs","bool"]]),
 C("browser","software","Navigateur web","Navigation web.",[["engine","Moteur","enum"],["privacy","Vie privée","enum"],["ram_usage","Usage de la RAM","enum"],["musl_support","Fonctionne sur musl","enum"],["extensions","Extensions","enum"]]),
 C("editor","software","Éditeur de texte / code","Édition de fichiers et de code.",[["interface","Interface","enum"],["footprint_mb","Empreinte mémoire","number","Mo"],["plugins","Extensibilité","enum"],["learning_curve","Courbe d'apprentissage","enum"],["lsp","Support LSP","enum"]]),
 C("media-player","software","Lecteur multimédia","Lecture audio et vidéo.",[["codecs","Formats pris en charge","enum"],["interface","Interface","enum"],["hw_accel","Accélération matérielle","bool"],["footprint_mb","Empreinte mémoire","number","Mo"],["scripting","Scripts","enum"]]),
 C("game-launcher","software","Lanceur de jeux","Installe et lance les jeux, y compris les jeux Windows.",[["stores","Boutiques gérées","text"],["windows_games","Jeux Windows","enum"],["open_source","Libre","bool"],["ease","Facilité","enum"],["musl_support","Fonctionne sur musl","enum"]]),
 C("office","software","Bureautique","Traitement de texte, tableur et présentations.",[["scope","Contenu de la suite","text"],["ms_compat","Compatibilité Microsoft Office","enum"],["footprint_mb","Empreinte mémoire","number","Mo"],["interface","Style d'interface","text"],["musl_support","Fonctionne sur musl","enum"]]),
 C("messaging","software","Messagerie et visio","Discuter, appeler, partager avec ses contacts ou sa communauté.",[["encryption","Chiffrement","text"],["open_source","Libre","bool"],["accounts","Compte nécessaire","text"],["voice_video","Voix et vidéo","bool"],["ease","Facilité","enum"]]),
 C("vcs","software","Contrôle de version","Suivre les modifications du code et collaborer.",[["interface","Interface","text"],["learning_curve","Courbe d'apprentissage","enum"],["offline","Fonctionne hors ligne","bool"],["scope","Rôle","text"]]),
 C("containers","software","Conteneurs","Faire tourner des applications isolées sans machine virtuelle.",[["rootless","Sans droits administrateur","bool"],["daemon","Démon permanent","bool"],["docker_compat","Compatibilité Docker","enum"],["compose","Orchestration (compose)","text"]]),
/* GEN-BEGIN */
 C("file-transfer","software","Transfert de fichiers entre appareils","Envoyer des fichiers entre téléphone, ordinateur et tablette.",[["platforms","Plateformes","text"],["transport","Réseau utilisé","text"],["encryption","Chiffrement","text"],["setup","Mise en place","enum"],["phone","Application mobile","bool"]]),
 C("file-sync","software","Synchronisation de dossiers","Garder les mêmes dossiers à jour sur plusieurs appareils.",[["model","Modèle","text"],["selfhost","Auto-hébergeable","bool"],["platforms","Plateformes","text"],["conflicts","Gestion des conflits","text"],["gui","Interface","text"]]),

function getHelp(k){
  if(HELP[k])return HELP[k];
  const m=/^crit:[^.]+\.(.+)$/.exec(k);
  return m?HELP["crit:"+m[1]]:null;
}
const qm=(k,t)=>getHelp(k)?`<button class="qm" data-help="${esc(k)}" data-t="${esc(t)}" aria-label="${tx("ui.help_of",{t:esc(t)})}">?</button>`:"";
function openHelp(k,t){
  const h=getHelp(k);if(!h)return;
  $("sh-t").textContent=t;$("sh-p").textContent=h[0];
  const a=$("sh-a");
  if(h[1]){a.href="https://fr.wikipedia.org/w/index.php?search="+encodeURIComponent(h[1]);a.classList.remove("hidden")}else a.classList.add("hidden");
  $("sheet").classList.remove("hidden");
}
function closeHelp(){$("sheet").classList.add("hidden")}
document.addEventListener("click",e=>{
  const b=e.target.closest(".qm");
  if(b){e.preventDefault();openHelp(b.dataset.help,b.dataset.t);return}
  if(e.target.id==="sh-bg"||e.target.id==="sh-x")closeHelp();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeHelp()});

function hwLabel(id,v){const q=HWQ.find(x=>x.id===id);const o=q&&q.o.find(y=>y[0]===v);return o?o[1]:v}
function hwSummary(ui){
  const parts=HWQ.filter(q=>HW[q.id]).map(q=>ui?trx(hwLabel(q.id,HW[q.id])):hwLabel(q.id,HW[q.id]));
  return (HW.model?HW.model+" · ":"")+(parts.length?parts.join(" · "):(ui?tx("hw.none"):"aucun détail"));
}

  if(HW.wifi==="broadcom")n.push("Wi-Fi Broadcom : firmware non libre à installer, sinon pas de Wi-Fi.");
  if(HW.wifi==="other")n.push("Wi-Fi MediaTek ou Atheros : en général pris en charge par le noyau et linux-firmware.");
  if(HW.boot==="bios")n.push("Démarrage BIOS : utiliser GRUB ou Limine. systemd-boot est exclu.");
  if(HW.boot==="uefi")n.push("Démarrage UEFI : prévoir une partition EFI (FAT32, environ 512 Mo).");
  if(HW.disk==="nvme"||HW.disk==="sata")n.push("SSD : activer le TRIM périodique (fstrim).");
  if(HW.disk==="hdd")n.push("Disque dur : ext4 suffit, évite les options coûteuses.");
  if(HW.disk==="emmc")n.push("eMMC ou carte SD : limiter les écritures (journaux en mémoire).");
  if(HW.ram==="4")n.push("Peu de mémoire : bureau léger conseillé, et zram (swap compressé).");
  if(HW.arch==="arm")n.push("ARM : tous les paquets doivent exister en aarch64. Steam et beaucoup de jeux ne sont pas natifs.");
  return n;
}

const maxCols=()=>4;
const state={layer:LAYERS[0].id,cat:"init",sel:[],view:"table",hideSame:false};

function setCat(cat,keep){
  state.cat=cat;
  const c=CATS.find(x=>x.id===cat);state.layer=c.layer;
  const ts=toolsOf(cat).map(t=>t.id);
  state.sel=keep?keep.filter(id=>ts.includes(id)).concat(ts.filter(id=>!keep.includes(id))).slice(0,2):ts.slice(0,2);
  render();
}

function fmt(c,v){
  if(v===null||v===undefined||v==="")return '<span class="no">—</span>';
  if(c.type==="bool")return v?'<span class="ok">'+tx("cmp.yes")+'</span>':'<span class="no">'+tx("cmp.no")+'</span>';
  if(c.type==="number")return esc(v)+(c.unit?" "+esc(c.unit):"");
  return esc(v);
}
function review(t){
  if(!t.last_reviewed)return '<span class="badge">'+tx("cmp.to_check")+'</span>';
  const m=(Date.now()-new Date(t.last_reviewed))/2.6e9;
  return m>12?'<span class="badge">'+tx("cmp.recheck")+'</span>':'<span class="tag">'+tx("cmp.reviewed",{d:esc(t.last_reviewed)})+'</span>';
}
const names=ids=>ids.map(i=>{const t=byId(i);return t?t.name:i}).join(", ");
const list=a=>a&&a.length?"<ul>"+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":'<span class="no">—</span>';

function render(){
  // sélecteurs
  $("layer").innerHTML=LAYERS.map(l=>`<option value="${l.id}"${l.id===state.layer?" selected":""}>${esc(l.name)}</option>`).join("");
  $("cat").innerHTML=CATS.filter(c=>c.layer===state.layer).map(c=>`<option value="${c.id}"${c.id===state.cat?" selected":""}>${esc(c.name)} (${toolsOf(c.id).length})</option>`).join("");
  const cat=CATS.find(c=>c.id===state.cat);
  $("desc").textContent=cat.description;
  $("layerQ").dataset.help="layer:"+state.layer;$("layerQ").dataset.t=LAYERS.find(l=>l.id===state.layer).name;
  $("catQ").dataset.help="cat:"+state.cat;$("catQ").dataset.t=cat.name;
  const all=toolsOf(cat.id);
  if(!all.length){$("main").innerHTML='<div class="empty">'+tx("cmp.empty")+'</div>';return}
  const cols=state.sel.map(byId).filter(Boolean);
  const rows=[];
  const R=(label,fn,qb)=>rows.push({label,vals:cols.map(fn),qb});
  const S=l=>rows.push({sec:l});
  R(tx("row.summary"),t=>esc(t.summary));
  R(tx("row.license"),t=>esc(t.license||"—"));
  R(tx("row.maturity"),t=>esc(t.maturity||"—"));
  R(tx("row.difficulty"),t=>t.difficulty?`<span title="${t.difficulty}/5">${"●".repeat(t.difficulty)}${"○".repeat(5-t.difficulty)}</span>`:"—");
  R(tx("row.sheet"),review);
  S(tx("sec.criteria"));
  cat.criteria.forEach(c=>R(c.label,t=>fmt(c,t.criteria&&t.criteria[c.key]),qm("crit:"+cat.id+"."+c.key,c.label)));
  S(tx("sec.review"));
  R(tx("row.pros"),t=>list(t.pros));
  R(tx("row.cons"),t=>list(consFor(t)));
  R(tx("row.learn"),t=>esc(t.learn||"—"));
  R(tx("row.used_by"),t=>esc((t.used_by||[]).join(", ")||"—"));
  S(tx("sec.compat"));
  R(tx("row.requires"),t=>t.requires.length?esc(names(t.requires)):'<span class="no">—</span>');
  R(tx("row.conflicts"),t=>t.conflicts.length?`<span class="conf">${esc(names(t.conflicts))}</span>`:'<span class="no">—</span>');
  R(tx("row.works_with"),t=>t.works_well_with.length?esc(names(t.works_well_with)):'<span class="no">—</span>');
  S(tx("sec.impl"));
  R(tx("row.commands"),t=>cmdsFor(t).length?cmdsFor(t).map(s=>`<details><summary>${esc(s.title)}</summary><pre>${esc(s.commands.join("\n"))}</pre></details>`).join(""):"—");
  R(tx("row.pitfalls"),t=>list(t.pitfalls));
  R(tx("row.docs"),t=>t.docs.length?"<ul>"+t.docs.map(d=>`<li><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.label)}</a></li>`).join("")+"</ul>":"—");
  // filtre « lignes identiques »
  let vis=rows;
  if(state.hideSame&&cols.length>1){
    vis=rows.filter(r=>r.sec||new Set(r.vals).size>1);
    vis=vis.filter((r,i)=>!r.sec||(vis[i+1]&&!vis[i+1].sec));
  }
  const hidden=rows.filter(r=>!r.sec).length-vis.filter(r=>!r.sec).length;
  const sel=(t,i)=>`<select data-col="${i}">${all.map(o=>`<option value="${o.id}"${o.id===t.id?" selected":""}>${esc(o.name)}</option>`).join("")}</select>${cols.length>1?`<button data-rm="${i}">${tx("cmp.remove")}</button>`:""}`;
  let h=`<div class="vbar"><div class="seg"><button data-view="table" class="${state.view==="table"?"on":""}">${tx("cmp.table")}</button><button data-view="crit" class="${state.view==="crit"?"on":""}">${tx("cmp.by_crit")}</button></div>
   <label class="chk"><input type="checkbox" id="hs"${state.hideSame?" checked":""}> ${tx("cmp.hide_same")}${state.hideSame&&hidden?" "+tx(hidden>1?"cmp.hidden_many":"cmp.hidden_one",{n:hidden}):""}</label></div>`;
  if(state.view==="table"){
    h+=`<div class="wrap"><table style="width:${100+cols.length*150}px;min-width:100%"><thead><tr><th class="corner"></th>`;
    cols.forEach((t,i)=>{h+=`<td class="hd">${sel(t,i)}</td>`});
    h+="</tr></thead><tbody>";
    vis.forEach(r=>{
      if(r.sec)h+=`<tr class="sec"><th>${esc(r.sec)}</th>${cols.map(()=>"<td></td>").join("")}</tr>`;
      else h+=`<tr><th>${esc(r.label)}${r.qb||""}</th>${r.vals.map(v=>`<td>${v}</td>`).join("")}</tr>`;
    });
    h+="</tbody></table></div>";
  }else{
    h+=`<div class="pick">${cols.map((t,i)=>`<div class="hd">${sel(t,i)}</div>`).join("")}</div><div class="cview">`;
    vis.forEach(r=>{
      if(r.sec)h+=`<div class="csec">${esc(r.sec)}</div>`;
      else h+=`<div class="cr"><div class="crl">${esc(r.label)}${r.qb||""}</div>${cols.map((t,i)=>`<div class="crv"><span class="crn">${esc(t.name)}</span><div>${r.vals[i]}</div></div>`).join("")}</div>`;
    });
    h+="</div>";
  }
  if(cols.length<Math.min(maxCols(),all.length))h+='<button class="add" id="add">'+tx("cmp.add_col")+'</button>';
  $("main").innerHTML=h;
}

/* événements */
$("layer").onchange=e=>{const c=CATS.find(x=>x.layer===e.target.value);setCat(c.id)};
$("cat").onchange=e=>setCat(e.target.value);
$("main").addEventListener("change",e=>{
  if(e.target.id==="hs"){state.hideSame=e.target.checked;render();return}
  const s=e.target.closest("select[data-col]");if(!s)return;
  const i=+s.dataset.col,j=state.sel.indexOf(s.value);
  if(j>-1&&j!==i)state.sel[j]=state.sel[i];
  state.sel[i]=s.value;render();
});
$("main").addEventListener("click",e=>{
  const vb=e.target.closest("[data-view]");if(vb){state.view=vb.dataset.view;render();return}
  if(e.target.id==="add"){
    const free=toolsOf(state.cat).find(t=>!state.sel.includes(t.id));
    if(free){state.sel.push(free.id);render()}
  }
  const rm=e.target.closest("[data-rm]");
  if(rm){state.sel.splice(+rm.dataset.rm,1);render()}
});
$("q").oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){$("res").innerHTML="";return}
  const hits=TOOLS.filter(t=>(t.name+" "+t.summary).toLowerCase().includes(q)).slice(0,8);
  $("res").innerHTML=hits.length?hits.map(t=>{const c=CATS.find(x=>x.id===t.category);return `<button class="chip" data-tool="${t.id}">${esc(t.name)} <small>${esc(c.name)}</small></button>`}).join(""):'<span class="no" style="font-size:13px">'+tx("cmp.no_result")+'</span>';
};
$("res").addEventListener("click",e=>{
  const b=e.target.closest("[data-tool]");if(!b)return;
  const t=byId(b.dataset.tool);setCat(t.category,[t.id]);
  $("q").value="";$("res").innerHTML="";
});

function swMusl(t){return t.musl||(t.criteria&&t.criteria.musl_support)||"oui"}
function swBad(tid,stack){const libc=(stack.find(x=>x.label==="Bibliothèque C")||{}).tool;const t=byId(tid);if(!t||libc!=="musl")return false;const m=swMusl(t);return m==="non"||m==="difficile"}
function swFuncs(tree){return tree.software.groups.flatMap(g=>g.funcs)}
function swFuncOf(tree,tid){return swFuncs(tree).find(f=>f.tools.includes(tid))}
function swSelection(tree,stack,eff){
  const out={};
  swFuncs(tree).forEach(f=>{const v=G.sw[f.id];out[f.id]=v===undefined?f.def(stack,eff):v});
  return out;
}
function swIssues(tree,stack,sel){
  const chosen=new Set(Object.values(sel).flat());
  stack.forEach(x=>{if(x.tool)chosen.add(x.tool)});
  const libc=(stack.find(x=>x.label==="Bibliothèque C")||{}).tool;
  const out=[];
  chosen.forEach(tid=>{
    const t=byId(tid);if(!t)return;
    if(libc==="musl"){const m=swMusl(t);
      if(m==="non"||m==="difficile")out.push({tid,kind:"musl",msg:tx("sw.musl",{n:t.name,s:tx(m==="non"?"sw.musl_no":"sw.musl_hard")})});}
    (t.requires||[]).forEach(r=>{const rt=byId(r);if(rt&&!chosen.has(r))out.push({tid,kind:"req",need:r,msg:tx("sw.needs",{a:t.name,b:rt.name})})});
  });
  return out;
}
function swToggle(fid,tid,tree,stack,eff){
  const sel=swSelection(tree,stack,eff);const cur=sel[fid].slice();

function softwareHtml(tree,stack,eff){
  const sel=swSelection(tree,stack,eff),issues=swIssues(tree,stack,sel);

    g.funcs.forEach(f=>{

        h+=`<div class="pan"><div><b>${esc(t.name)}</b>${t.suite?` <span class="nofiche">${tx("sw.suite",{s:esc(t.suite)})}</span>`:""} : ${esc(t.summary)}</div>`+
          (t.pros.length?`<div style="margin-top:4px"><b>${tx("g.pros")}</b> ${esc(t.pros.slice(0,2).join(" ; "))}</div>`:"")+
          (consFor(t).length?`<div><b>${tx("g.cons")}</b> ${esc(consFor(t).slice(0,2).join(" ; "))}</div>`:"")+
          (needsFor(t).length?`<div style="margin-top:4px"><b>${tx("sw.also_install_c")}</b><ul>${needsFor(t).map(n=>"<li>"+esc(n)+"</li>").join("")}</ul></div>`:"")+(cmdsFor(t).length?`<div style="margin-top:4px"><b>${esc(cmdsFor(t)[0].title)} :</b><pre>${esc(cmdsFor(t)[0].commands.join("\n"))}</pre></div>`:"")+
          (swBad(tip,stack)&&!is.length?`<div class="conf" style="margin-top:4px">⚠ ${tx("sw.musl",{n:esc(t.name),s:tx(swMusl(t)==="non"?"sw.musl_no":"sw.musl_hard")})}</div>`:is.map(x=>`<div class="conf" style="margin-top:4px">⚠ ${esc(x.msg)}</div>`).join(""))+

      // alertes sur les outils choisis de cette fonction
      cur.forEach(tid=>{issues.filter(x=>x.tid===tid).forEach(x=>{
        const key="sw-"+x.kind+"-"+tid;
        if(G.keep[key]){h+=`<div class="kept">⚠ ${esc(x.msg)} ${tx("g.kept")}</div>`;return}
        let fx="";
        if(x.kind==="musl"){
          const alt=f.tools.filter(o=>o!==tid&&!cur.includes(o)&&!swBad(o,stack)).slice(0,2);

        }else{

          fx+=`<button class="p" data-swtoggle="${f.id}|${tid}">${tx("sw.remove_n",{n:esc(byId(tid).name)})}</button>`;
        }
        h+=`<div class="warn">⚠ ${esc(x.msg)}<div>${fx}<button data-keep="${key}">${tx("g.keep")}</button></div></div>`})});
      h+="</div>";

  h+=`<div class="nofiche" style="margin:6px 0 0">${tx(chosen.length>1?"sw.count_many":"sw.count_one",{n:chosen.length})}</div>`;
  return h+'<button class="big" data-md="1" style="margin-top:16px">'+tx("g.gen_md")+'</button><button class="ghost" data-swback="1">'+tx("sw.back")+'</button></div>';

function curBase(){
  if(BN[G.base])return G.base;
  if(G.obj&&TREES[G.obj]){
    try{const tr=TREES[G.obj];const eff=effOf(tr),unk=tr.questions.map((q,k)=>G.ans[k]<0);
      const b=tr.resolve(eff,unk).find(x=>x.label==="Distribution de base");return b?b.tool:null}catch(e){return null}
  }
  return null;
}
function mapPkgs(names,base){return names.split(/\s+/).map(n=>{const o=PKG[n];return o&&o[base]!==undefined?o[base]:n}).filter(Boolean).join(" ")}
function cmdsFor(t){
  const base=curBase();
  if(!base||base==="alpine")return t.implement;
  return t.implement.map(st=>{
    if(!/^Installer \(Alpine/.test(st.title))return st;
    const cmds=[];
    st.commands.forEach(c=>{
      let m=/^apk add (.+)$/.exec(c);
      if(m){if(!BPM[base]){if(!cmds.length)cmds.push("# "+BN[base]+" : pas de gestionnaire de paquets, compiler depuis les sources");return}const n=mapPkgs(m[1],base);if(n)cmds.push(BPM[base].endsWith("#")?BPM[base]+n.split(" ").join(" nixpkgs#"):BPM[base]+" "+n);return}
      m=/^rc-update add (\S+) default$/.exec(c);if(m){cmds.push("systemctl enable --now "+m[1]);return}
      if(/^service \S+ start$/.test(c))return;
      cmds.push(c);
    });
    return {title:"Installer ("+BN[base]+", noms de paquets à vérifier)",commands:cmds};
  });
}

function trx(s){

// TUTO_EN (clé = phrase française avec jetons, valeur = anglais avec les mêmes jetons), puis sont remis tels quels.

const D=v=>"\uE000"+v+"\uE001";

function trtMask(s){
  const sp=[];
  const m=s.replace(/\uE000([\s\S]*?)\uE001|\uE002([\s\S]*?)\uE003|`[^`\n]*`/g,(x,d,l)=>{sp.push(d!==undefined?d:l!==undefined?trx(l):x);return "⟦"+(sp.length-1)+"⟧"});
  return {m,sp};
}
function trtLook(s){
  const {m,sp}=trtMask(s),r=TUTO_EN[m];
  return r===undefined?null:r.replace(/⟦(\d+)⟧/g,(x,i)=>sp[+i]);
}
function trt(s){
  if(typeof s!=="string"||!s)return s;
  if(LANG!=="en")return unD(s);
  const lead=(s.match(/^\s+/)||[""])[0],body=s.slice(lead.length);
  const one=x=>{const r=trtLook(x);if(r!==null)return r;const c=unD(x);
    if(FRAG[c]!==undefined)return FRAG[c];
    if(/[A-Za-zÀ-ÿ]{3}/.test(trtMask(x).m.replace(/⟦\d+⟧/g,"")))TUTO_MISS.add(trtMask(x).m);
    return c};
  const whole=trtLook(body);
  if(whole!==null)return lead+whole;
  const parts=body.split(/(?<=[.!?])\s+(?=[A-ZÉÀ«*`\uE000])/);
  return lead+(parts.length>1?parts.map(one).join(" "):one(body));
}

  const objName=trd(obj.name);

    if(s.where){P(tx("tuto.where",{w:{hote:tx("tuto.where.hote"),live:tx("tuto.where.live"),chroot:tx("tuto.where.chroot"),systeme:tx("tuto.where.systeme")}[s.where]}));P("")}
    if(s.why){P(tx("tuto.why",{t:s.dataWhy==="fiche"?s.why:s.dataWhy?trd(s.why):trt(s.why)}));P("")}
    if(s.needs&&s.needs.length){P(tx("tuto.needs"));s.needs.forEach(n=>P("- "+unD(n)));P("")}

    if(s.docs&&s.docs.length){P(tx("tuto.docs",{t:s.docs.map(d=>`[${dl(d[0])}](${d[1]})`).join(", ")}));P("")}
    P(tx("tuto.report",{url:issueUrl("commande-qui-echoue.yml",`[${ref}] ${title}`,{base:BD.name,parcours:objName,etape:`${ref} (${title})`,version:APP_VERSION})}));P("");
  });
  P("## "+tx("tuto.pkglist"));P("");

  P(tx("tuto.tool",{t:trt(BUILD.tool)}));P("");

  P("");
  const cnt={tested:0,ok:0,check:0,manual:0,info:0};steps.forEach(s=>cnt[s.state||"check"]++);
  P("## "+tx("tuto.recap"));P("");
  P(tx("tuto.recap.head"));P("|---|---|");
  ["tested","ok","check","manual","info"].forEach(k=>P(`| ${stx(k)} | ${cnt[k]} |`));
  P("");
  P(tx(cnt.tested?"tuto.recap.yes":"tuto.recap.no"));
  P("");
  // bloc à copier : choix faits dans l'app seulement (pas le modèle de machine saisi, ni nom ni chemin local)
  const swNames=[...new Set(Object.values(sel).flat())].filter(id=>!stack.some(x=>x.tool===id)).map(id=>(byId(id)||{}).name).filter(Boolean);
  const hwParts=HWQ.filter(q=>HW[q.id]).map(q=>trd(hwLabel(q.id,HW[q.id])));
  P("## "+tx("tuto.sig"));P("");
  P(tx("tuto.sig.lead",{url:REPO_URL+"/issues/new/choose"}));P("");
  P("```text");
  P(tx("tuto.sig.ver",{v:APP_VERSION}));
  P(tx("tuto.sig.date",{v:VM?VM.verified_on:tx("tuto.sig.nodate")}));
  P(tx("tuto.sig.base",{v:BD.name}));
  P(tx("tuto.sig.path",{v:objName}));
  P(tx("tuto.sig.choices"));
  stack.forEach(x=>P(tx("tuto.sig.item",{l:trd(x.label),n:x.name+(x.manual?tx("tuto.manual"):"")})));
  if(swNames.length)P(tx("tuto.sig.sw",{v:swNames.join(", ")}));
  if(hwParts.length)P(tx("tuto.sig.hw",{v:hwParts.join(" · ")}));
  P(tx("tuto.sig.step"));
  P(tx("tuto.sig.cmd"));
  P(tx("tuto.sig.err"));
  P("```");
  return L.join("\n")+"\n";
}

function setManual(label,tool){
  if(label==="Distribution de base"){G.base=BN[tool]?tool:"undecided";return}
  const tree=TREES[G.obj],eff=effOf(tree),unk=tree.questions.map((q,k)=>G.ans[k]<0);
  const r=tree.resolve(eff,unk).find(x=>x.label===label);

}
function advance(tree){const n=tree.questions.length;while(G.i<n){const q=tree.questions[G.i];if(q.skipIf&&q.skipIf()){G.ans[G.i]=q.fromHw();G.hwAuto[G.i]=true;G.i++}else break}}
function reconcile(tree){
  // après modification du matériel : recalcule les questions sautées
  for(let i=0;i<G.i;i++){
    const q=tree.questions[i];
    if(q.skipIf&&q.skipIf()){G.ans[i]=q.fromHw();G.hwAuto[i]=true}
    else if(G.hwAuto[i]){G.i=i;G.ans.length=i;Object.keys(G.hwAuto).forEach(x=>{if(+x>=i)delete G.hwAuto[x]});G.changed=G.changed.filter(c=>c.i<i);break}
  }
  advance(tree);
}

});
function setMode(m){
  $("cmpBack").classList.toggle("hidden",!(m==="compare"&&(G.scope||G.obj)));
  $("guide").classList.toggle("hidden",m!=="guide");
  $("compare").classList.toggle("hidden",m!=="compare");
  $("tabG").classList.toggle("on",m==="guide");
  $("tabC").classList.toggle("on",m==="compare");
  if(m==="guide")renderGuide();
}
$("cmpBackBtn").onclick=()=>{setMode("guide");scrollTo(0,0)};
$("tabG").onclick=()=>setMode("guide");
$("tabC").onclick=()=>setMode("compare");
$("langBtn").onclick=()=>setLang(LANG==="fr"?"en":"fr",false,true);
setLang(initialLang(),true);
setCat("init");
setMode("guide");
</script>
</body>
</html>
